# dsh-theme-probe bundle patch: inserts this bundle's dsh.client row into the web roster.
#
# The row is the whole wiring. `name` resolves to the installed package, and the
# loader then reads that package's exports['./client'] — so the browser half is
# addressed by package name, never by a path into a checkout.
- insert:
    - id: ui-skin-dsh-theme-probe
      name: 'dsh-theme-probe'
