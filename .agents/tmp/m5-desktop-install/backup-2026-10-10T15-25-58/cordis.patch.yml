- insert:
    - id: mcp-git
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: git
        transport: stdio
        command: uvx
        args:
          - mcp-server-git

- insert:
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: stdio
        command: npx
        args:
          - '-y'
          - '@fre4x/github'
        env:
          GITHUB_TOKEN: !!js process.env.GITHUB_TOKEN

- insert:
    - id: mcp-gitx
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: gitx
        transport: stdio
        command: npx
        args:
          - '-y'
          - 'git-mcp'

