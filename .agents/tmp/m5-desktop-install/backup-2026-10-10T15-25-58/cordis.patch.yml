- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: codex-chatgpt
    model: gpt-6.1-sol
    reasoningEffort: xhigh
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system
- id: mnemon
  name: dsh-mnemon
  config:
    remoteAccess: read-only
    storageScope: custom
    dataDir: E:\dsh-shared/mnemon
    timeoutMs: 10000
    defaultRecallLimit: 10
    embedding:
      enabled: false
      endpoint: http://localhost:11434
      model: nomic-embed-text
    memoryView:
      strategyTypeId: default-three-tier
      entries:
        include:mnemon-strategy-light-context:
          enabled: true
          config: {}
        include:mnemon-strategy-scoped:
          enabled: true
          config: {}
        include:mnemon-strategy-general:
          enabled: false
          config: {}
    legacySettingsImported: true
    recallQuality:
      policy: strict-v1
      lowScoreThreshold: 0.25
      highScoreThreshold: 0.6
      candidateMultiplier: 3
      maxMediumResults: 4
      maxUnknownResults: 2
    routingGuidance: true
    displayMode: sidebar
    tabEnabled: true
    writeEnabled: true
    lifecycleEnabled: true
    recallMode: guided
    writebackMode: guided
    idleReviewMs: 30000
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      step-plan:
        displayName: Step Plan
        apiKeyEnv: STEP_PLAN_API_KEY
        api: openai-completions
        baseURL: https://api.stepfun.com/step_plan/v1
        compat:
          supportsDeveloperRole: false
          thinkingFormat: openai
        models:
          - id: step-3.7-flash
            name: Step 3.7 Flash (Plan)
            contextWindow: 262144
            maxTokens: 65536
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
          - id: step-5-preview
            name: step-5-preview
            contextWindow: 1024000
      cline-pass:
        displayName: ClinePass
        apiKeyEnv: CLINE_API_KEY
        api: openai-completions
        baseURL: https://api.cline.bot/api/v1
        compat:
          supportsDeveloperRole: false
          thinkingFormat: deepseek
        models:
          - id: cline-pass/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 393216
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              max: max
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V41-Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        imagePixelBudget: 640000
        imageMaxBytes: 1048576
        systemPromptUpdate: in-history
      - id: deepseek-v4-flash
        name: DeepSeek-V4-Flash
        description: Fast, efficient, and economical; suited to focused, routine, or
          parallel tasks.
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        imagePixelBudget: 640000
        imageMaxBytes: 1048576
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
      - id: deepseek-v4-flash-vision-exp
        name: DeepSeek-V4-Flash-Vision-Exp
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        imagePixelBudget: 640000
        imageMaxBytes: 1048576
- id: llm-verifier
  name: dsh-llm-verifier
  config:
    autoMaxModelCallsPerTask: 120
    autoMaxModelCallsPerSession: 320
    provider: minimax-code
    model: MiniMax-M3.1-Flash-Preview
    reasoningEffort: max
    extraJudges:
      - provider: antigravity
        model: gemini-3.8-flash
        reasoningEffort: high
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc-orchestrator
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: minimax-code
        model: MiniMax-M3.1-Flash-Preview
      - provider: workbuddy-subscription
        model: deepseek-v4.1-flash
