# dsh-theme bundle patch：把本插件的 dsh.client 行插进 web roster。
#
# 这一行就是全部接线。name 解析到已安装的包，loader 随后读该包的 exports["./client"]，
# 所以浏览器半按包名寻址，绝不写进 checkout 的路径。
#
# disabled 这里刻意只写静态 true/false：本主题不需要按 Loader 上下文动态启停。
# 当前版本已支持在 disabled/config 中求值 !!js；不要把它用于 isolate/intercept 等字面元数据。
# 整体禁用 = 把 false 改成 true。
- insert:
    - id: ui-skin-dsh-theme
      name: 'dsh-theme'
      disabled: false
